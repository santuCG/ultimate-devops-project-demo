name: Terraform Workflow

on:
  workflow_dispatch:
    inputs:

      enable-static-analysis:
        description: "Run static analysis"
        required: false
        default: false
        type: boolean

      action:
        description: "Select terraform action"
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy


env:
  TF_WORKING_DIR: eks-install
  AWS_REGION: us-west-2


jobs:

# -----------------------
# STATIC ANALYSIS (optional)
# -----------------------
 static-analysis:
    runs-on: ubuntu-latest
 
    if: ${{ github.event.inputs.enable-static-analysis == 'true' }}

    steps:

        - name: Checkout
          uses: actions/checkout@v4
 
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
 
        - name: Run Checkov
          uses: bridgecrewio/checkov-action@v12
          with:
            directory: eks-install
            framework: terraform
            check: CIS
            skip_check: CKV_AWS_41
            output_format: json
            output_file_path: reports/checkov.json

        - name: Upload Checkov report
          uses: actions/upload-artifact@v4
          with:
            name: checkov-report
            path: reports/checkov.json

# -----------------------
# PLAN (always before apply/destroy)
# -----------------------
  terraform-plan:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}


# -----------------------
# APPLY (manual choice)
# -----------------------
  terraform-apply:
    runs-on: ubuntu-latest

    needs: terraform-plan

    if: ${{ github.event.inputs.action == 'apply' }}

    steps:

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform apply -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}


# -----------------------
# DESTROY (manual choice)
# -----------------------
  terraform-destroy:
    runs-on: ubuntu-latest

    needs: terraform-plan

    if: ${{ github.event.inputs.action == 'destroy' }}

    steps:

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform destroy -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}